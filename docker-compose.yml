# UNTESTED in the build environment - treat as a starting point.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root mlflow-artifacts:/ --artifacts-destination /mlflow/artifacts --serve-artifacts
             --allowed-hosts "*"
    ports: ["5000:5000"]
    volumes: ["mlflow_data:/mlflow"]
  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["8000:8000"]
    depends_on: [mlflow]
volumes:
  mlflow_data:
